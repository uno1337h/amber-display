name: build
on: [push, workflow_dispatch]
jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install PyQt6 pyinstaller
      - run: python -m PyInstaller --onefile --noconsole --name Amber amber.py
      - uses: actions/upload-artifact@v4
        with: { name: Amber, path: dist/Amber.exe }
